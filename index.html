<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 数字人交互桌面 - 终极安全版</title>
    <style>
        body { background-color: #F4EBE2; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #222; }
        .container { width: 380px; background: #fff; border: 3px solid #111; box-shadow: 6px 6px 0px #FF4800; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        
        .avatar-box { 
            height: 380px; 
            background-color: #000; 
            position: relative; 
            border-bottom: 3px solid #111; 
            overflow: hidden; 
        }
        
        .avatar-image { 
            width: 100%;    
            height: 100%;   
            border-radius: 0; 
            border: none;     
            object-fit: contain; 
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #video-container { 
            width: 100%; 
            height: 100%; 
            display: none; 
            object-fit: contain; 
            position: absolute; 
            top: 0; 
            left: 0;
        }

        .chat-box { padding: 20px; height: 130px; overflow-y: auto; background-image: radial-gradient(#ccc 1px, transparent 1px); background-size: 10px 10px; border-top: 3px solid #111; }
        .status-text { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #FF4800; }
        .message { font-size: 16px; line-height: 1.5; }
        .control-panel { padding: 20px; background: #fff; border-top: 3px solid #111; text-align: center; }
        button { background-color: #FFEC00; border: 3px solid #111; box-shadow: 3px 3px 0px #111; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: all 0.1s; }
        button:active { box-shadow: 0px 0px 0px #111; transform: translate(3px, 3px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="avatar-box">
        <img class="avatar-image" id="static-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ccc' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
        <video id="video-container" playsinline></video>
    </div>

    <div class="chat-box">
        <div class="status-text" id="status">系统待机中...</div>
        <div class="message" id="message"></div>
    </div>

    <div class="control-panel">
        <button id="mic-btn">🎙️ 点击说话</button>
    </div>
</div>

<script>
    // 你的公网固定照片链接
    const FIXED_IMAGE_HTTPS_URL = "https://ai-avatar-wwl.oss-cn-beijing.aliyuncs.com/ren.jpg";

    const staticAvatar = document.getElementById('static-avatar');
    const videoContainer = document.getElementById('video-container');
    const micBtn = document.getElementById('mic-btn');
    const statusEl = document.getElementById('status');
    const messageEl = document.getElementById('message');

    if(FIXED_IMAGE_HTTPS_URL && FIXED_IMAGE_HTTPS_URL.startsWith('http')){
        staticAvatar.src = FIXED_IMAGE_HTTPS_URL;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN'; 
    let isRecording = false;

    micBtn.addEventListener('click', () => {
        if (!isRecording) {
            recognition.start();
            statusEl.innerText = "正在聆听...";
            micBtn.innerText = "🛑 录音中";
            isRecording = true;
        }
    });

    recognition.onresult = (event) => {
        const userText = event.results[0][0].transcript;
        messageEl.innerHTML = `<strong>你：</strong>${userText}`;
        statusEl.innerText = "大脑思考中...";
        micBtn.innerText = "🎙️ 点击说话";
        isRecording = false;
        callDeepSeek(userText);
    };

    // 已经彻底剥离本地密钥，全权交给 Laf 代理请求
    async function callDeepSeek(text) {
        try {
            const dsResponse = await fetch('https://jdy2zamav3.sealoshzh.site/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            
            const data = await dsResponse.json();
            const aiReply = data.reply;
            messageEl.innerHTML = `<strong>AI：</strong>${aiReply}`;
            
            generateTalkingHeadVideo(aiReply);
        } catch (error) {
            statusEl.innerText = "网络连接出错";
            console.error(error);
        }
    }

    // 调用 Laf 的视频生成与轮询接口
    async function generateTalkingHeadVideo(text) {
        try {
            statusEl.innerText = "正在请求数字人接口...";
            
            const generateRes = await fetch('https://jdy2zamav3.sealoshzh.site/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            
            const generateData = await generateRes.json();
            const taskId = generateData.task_id;
            
            if (!taskId) throw new Error("提交任务失败");
            statusEl.innerText = "视频生成中 (约需20-40秒)...";

            const pollInterval = setInterval(async () => {
                try {
                    const statusRes = await fetch(`https://jdy2zamav3.sealoshzh.site/status?task_id=${taskId}`);       
                    const statusData = await statusRes.json();
                    
                    const currentStatus = statusData.status || (statusData.output && statusData.output.task_status);
                    const rawUrl = statusData.video_url || (statusData.output && statusData.output.results && statusData.output.results.video_url);

                    if (currentStatus === 'SUCCEEDED') {
                        clearInterval(pollInterval);
                        
                        if (rawUrl) {
                            const safeUrl = rawUrl.replace("http://", "https://");
                            staticAvatar.style.display = 'none';
                            videoContainer.src = safeUrl;
                            videoContainer.style.display = 'block';
                            statusEl.innerText = "播放中...";
                            
                            videoContainer.play();
                            
                            videoContainer.onended = () => {
                                videoContainer.style.display = 'none';
                                staticAvatar.style.display = 'block';
                                statusEl.innerText = "系统待机中...";
                            };
                        } else {
                            statusEl.innerText = "没拿到视频链接";
                        }
                    } else if (currentStatus === 'FAILED') {
                        clearInterval(pollInterval);
                        statusEl.innerText = "视频生成失败";
                    }
                } catch (pollErr) {
                    console.error("轮询出错:", pollErr);
                }
            }, 3000);

        } catch (error) {
            statusEl.innerText = "生成视频错误";
            console.error(error);
        }
    }
</script>
</body>
</html>
