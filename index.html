        /* 🌟 现代 AI 思考状态动画 (流光文字 + 呼吸星芒) */

            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            font-size: 14.5px;
            font-weight: 600;
            /* 流光渐变色配置 */

        /* 保证图标垂直居中，并加入闪烁动画 */
        .ai-sparkle-icon {
            display: inline-block;
            animation: pulseSparkle 1.5s ease-in-out infinite;
        }

        @keyframes gradientShine {
            to { background-position: 200% center; }
        }

        @keyframes pulseSparkle {
            0%, 100% { transform: scale(0.85); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 6px rgba(155, 81, 224, 0.5)); }
        }
        
        /* 顺便美化一下用户的提问文本 */
        .user-text-style {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            padding-bottom: 5px;
            border-bottom: 1px dashed rgba(0,0,0,0.05);
        }
        /* --- 核心亮色拟态背景 --- */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, #fdfaff 0%, #f0ebff 40%, #e6f0ff 80%, #f3ebff 100%);
            color: #333333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            /* 阻止 iOS 点击产生灰色/蓝色高亮半透明遮罩 */
            -webkit-tap-highlight-color: transparent; 
            /* 阻止长按出现默认菜单（保存图片、全屏等） */
            -webkit-touch-callout: none;
            /* 阻止浏览器默认的下拉回弹（橡皮筋效果）和手势导航 */
            overscroll-behavior-y: none;

        }

            width: 100%; 
            max-width: 400px; 
            height: 100%; 
            max-height: 850px;
            position: relative;

        /* --- 1. 顶部导航 --- */

        }

        .icon-btn:active { transform: scale(0.8); }

        .weather-info {

        }

        /* --- 2. 头部数字人与欢迎区 --- */

        }

        }

        /* 🌟 核心修改区：让图片和视频完美重叠，并加入透明度过渡动画实现丝滑切换 */
        /* 🌟 核心修改区：让图片和视频完美重叠，并加入透明度过渡动画实现丝滑切换 */

       .greeting-container {

        .glass-panel {

       /* 🔵 全局讲话背景呼吸灯特效 (音频随动版) */

        .loading-bar-bg {

        /* 🎤 用户录音时的底部环境光晕 (随麦克风音量闪烁) */
        body::after {

        /* 🔄 换一换按钮样式 */
        .refresh-btn {

        }
    </style>

<script>
    // ==========================================
    // 🌌 1. 神经元粒子特效引擎 (AI 科技感)
    // ==========================================
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    let pWidth = pCanvas.width = window.innerWidth;
    let pHeight = pCanvas.height = window.innerHeight;
    
    const particles = [];
    // 生成 60 个随机运动的粒子
    for (let i = 0; i < 60; i++) {
        particles.push({
            x: Math.random() * pWidth,
            y: Math.random() * pHeight,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5,
            radius: Math.random() * 2 + 1
        });
    }

    let particleAnimationId;
    function drawParticles() {
        pCtx.clearRect(0, 0, pWidth, pHeight);
        
        // 绘制粒子并检测距离连线 (模拟神经网络)
        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            // 边缘反弹
            if (p.x < 0 || p.x > pWidth) p.vx *= -1;
            if (p.y < 0 || p.y > pHeight) p.vy *= -1;

            pCtx.beginPath();
            pCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            pCtx.fillStyle = 'rgba(155, 81, 224, 0.4)';
            pCtx.fill();

            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 100) {
                    pCtx.beginPath();
                    pCtx.moveTo(p.x, p.y);
                    pCtx.lineTo(p2.x, p2.y);
                    // 距离越近，线条越清晰
                    pCtx.strokeStyle = `rgba(74, 144, 226, ${1 - dist / 100})`;
                    pCtx.lineWidth = 0.5;
                    pCtx.stroke();
                }
            }
        }
        particleAnimationId = requestAnimationFrame(drawParticles);
    }
    
    // 适配屏幕旋转或尺寸变化
    window.addEventListener('resize', () => {
        pWidth = pCanvas.width = window.innerWidth;
        pHeight = pCanvas.height = window.innerHeight;
    });

    drawParticles(); // 启动粒子特效

    // ==========================================
    // 🚀 2. 核心媒体资源预加载调度中心 (修复兼容性版)
    // ==========================================
    const assetsToLoad = [
        { id: 'static-avatar', type: 'image' },
        { id: 'thinking-video', type: 'video' },
        { id: 'talking-video', type: 'video' }
    ];

    let actualProgress = 0; 
    let displayProgress = 0; 
    const loadingText = document.getElementById('loading-text');
    const loadingBar = document.getElementById('loading-bar');
    const loadingScreen = document.getElementById('loading-screen');
    // 修复：改用 class 选择器，防止 HTML 漏加 id 导致报错
    const appContainer = document.querySelector('.app-container'); 

    // 平滑进度条动画
    function animateProgress() {
        if (displayProgress < actualProgress) {
            displayProgress += (actualProgress - displayProgress) * 0.15; 
            if (actualProgress - displayProgress < 0.5) displayProgress = actualProgress;
            
            const intProgress = Math.round(displayProgress);
            loadingText.innerText = `正在唤醒小智... ${intProgress}%`;
            loadingBar.style.width = `${intProgress}%`;
        }

        if (displayProgress >= 99.5) {
            // 资源就绪，执行退场动画
            loadingText.innerText = "系统启动完毕";
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                loadingScreen.style.visibility = 'hidden';
                if(appContainer) appContainer.style.opacity = '1'; 
                cancelAnimationFrame(particleAnimationId); // 停掉粒子以节省性能
            }, 500);
            return; 
        }
        requestAnimationFrame(animateProgress);
    }
    animateProgress();

   // ==========================================
    // 🚀 真正稳定且兼容的预加载逻辑 (防呆兼容版)
    // ==========================================
    function preloadAssets() {
        let loadedCount = 0;

        // 统一进度推进函数
        const checkReady = () => {
            loadedCount++;
            actualProgress = (loadedCount / assetsToLoad.length) * 100;
        };

        // 🚨 兜底机制：最多只等 8 秒，直接强制进入页面
        const fallbackTimeout = setTimeout(() => {
            if (actualProgress < 100) {
                console.warn("预加载超时或被拦截，强制开启主界面");
                actualProgress = 100;
            }
        }, 8000);

        for (let i = 0; i < assetsToLoad.length; i++) {
            const asset = assetsToLoad[i];
            const domElement = document.getElementById(asset.id);
            
            // 如果没找到元素，直接跳过记为完成，防止卡死
            if (!domElement) {
                checkReady();
                continue;
            }

            // 💡 核心修复：同时兼容 data-src 和 src 两种写法！
            const sourceUrl = domElement.getAttribute('data-src') || domElement.getAttribute('src');
            
            if (!sourceUrl || sourceUrl === 'null') {
                 checkReady();
                 continue;
            }

            // 如果还没把真实 URL 赋给 src，则赋值触发下载
            if (domElement.getAttribute('src') !== sourceUrl) {
                domElement.src = sourceUrl; 
            }

            // 监听真实的加载完成事件
            if (asset.type === 'image') {
                // 如果图片已经存在于浏览器缓存中，直接判定加载完成
                if (domElement.complete) {
                    checkReady();
                } else {
                    domElement.onload = checkReady;
                    domElement.onerror = checkReady; // 即使加载失败，也要推进进度
                }
            } else if (asset.type === 'video') {
                // 如果视频的元数据或首帧已经就绪 (readyState >= 2)，直接判定完成
                if (domElement.readyState >= 2) {
                    checkReady();
                } else {
                    domElement.load();
                    domElement.onloadeddata = checkReady; 
                    domElement.onerror = checkReady;
                }
            }
        }
    }

    // ==========================================
    // 🌊 波浪动画引擎 (已加入用户麦克风底部光圈互动)
    // ==========================================
    function drawWave() {
        if (!isRecording && !isAITalking) {
            document.body.style.setProperty('--bg-light-opacity', '0'); // 关闭AI蓝光
            document.body.style.setProperty('--user-glow-opacity', '0'); // 关闭用户紫光
            return; 
        }
        drawVisual = requestAnimationFrame(drawWave);
        let averageVolume = 0;
        
        // 1. 从音频分析器中获取真实声音数据 (麦克风或AI均有效)
        if (analyser) {
            const bufferLength = analyser.frequencyBinCount; 
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray); 
            let sum = 0; for(let i = 0; i < bufferLength; i++) sum += dataArray[i];
            averageVolume = sum / bufferLength;
        }

        // 2. AI 说话时的兜底模拟逻辑
        if (isAITalking && averageVolume < 2) {
             const time = Date.now() / 150; 
             averageVolume = 25 + Math.sin(time) * 15 + Math.random() * 15; 
        }

        // 3. 计算当前平滑振幅
        let targetAmplitude = (averageVolume / 100); 
        if (targetAmplitude < 0.1) targetAmplitude = 0.1; 
        currentAmplitude += (targetAmplitude - currentAmplitude) * 0.15; 

        // 🔵 4. 核心：声光同步映射体系 (根据谁在说话亮不同的光)
        if (isAITalking) {
            // 小智说话：亮起全局蓝色光晕
            let lightOpacity = currentAmplitude * 1.5; 
            if (lightOpacity > 1.0) lightOpacity = 1.0; 
            document.body.style.setProperty('--bg-light-opacity', lightOpacity.toFixed(2));
            document.body.style.setProperty('--user-glow-opacity', '0');
        } else if (isRecording) {
            // 🟣 用户说话：亮起底部紫色光晕！(稍微放大一点倍数，对手机麦克风更灵敏)
            let userGlow = currentAmplitude * 2.0; 
            if (userGlow > 1.0) userGlow = 1.0;
            document.body.style.setProperty('--user-glow-opacity', userGlow.toFixed(2));
            document.body.style.setProperty('--bg-light-opacity', '0');
        }

        // 5. 绘制底部波浪线
        canvasCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
        phase += 0.08; 
        const centerY = waveCanvas.height / 2; const width = waveCanvas.width;
        const currentWaves = isRecording ? userWaves : aiWaves;
        currentWaves.forEach(wave => {
            canvasCtx.beginPath(); canvasCtx.moveTo(0, centerY);
            for (let x = 0; x <= width; x++) {
                const xNorm = x / width; const taper = Math.sin(xNorm * Math.PI); 
                const y = centerY + Math.sin(xNorm * 8 + phase * wave.speed) * (currentAmplitude * 40 * wave.height) * taper;
                canvasCtx.lineTo(x, y);
            }
            canvasCtx.strokeStyle = wave.color; canvasCtx.lineWidth = wave.lineWidth; canvasCtx.stroke();
        });
    }

    async function startVisualizer() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; microphone.connect(analyser);
            } catch(err) { return; }
        }
        if (audioContext.state === 'suspended') audioContext.resume();
        waveSpacer.style.display = 'none'; waveCanvas.style.display = 'block';
        if (!drawVisual) drawWave();
    }

                <div class="user-text-style"><strong>🧑 你：</strong>${text}</div>
                <div class="ai-generating-wrapper">
                    <svg class="ai-sparkle-icon" viewBox="0 0 24 24" width="18" height="18" fill="url(#sparkle-grad)">
                        <defs>
                            <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#9b51e0" />
                                <stop offset="100%" stop-color="#4a90e2" />
                            </linearGradient>
                        </defs>
                        <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"></path>
                    </svg>
                    小智正在极速检索知识库...
                </div>
            `; 
            
            statusEl.innerText = "正在为您检索信息"; 
            
            const dsResponse = await fetch('https://ojr9d97ks4.sealosbja.site/chat', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text })
            });
            const data = await dsResponse.json();
            const aiReply = data.reply;
            
            generateTalkingHeadVideo(text, aiReply);
        } catch (error) {
            statusEl.innerText = "网络似乎有点小情绪"; 
            enableMicUI(); switchAvatarState('idle'); 
            messageEl.innerHTML = `<div class="user-text-style"><strong>🧑 你：</strong>${text}</div><br><strong>小智：</strong>网络好像开小差了，请稍后再试一次吧。`;
        }
    }

   // ==========================================
    // 🧠 接口交互 (修复跨域导致的静音问题)
    // ==========================================
    async function generateTalkingHeadVideo(userText, aiReply) {
        try {
            statusEl.innerText = "正在努力组织语言"; 
            
            const generateRes = await fetch('https://ojr9d97ks4.sealosbja.site/generate', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: aiReply })
            });
            const generateData = await generateRes.json();
            if (!generateData.audio_url) throw new Error("获取音频失败");

            const safeAudioUrl = generateData.audio_url.replace("http://", "https://");
            const audioPlayer = new Audio(safeAudioUrl);
            
            // 🚨 修复核心：移除了 crossOrigin 和 Web Audio API (audioContext) 的绑定
            // 避免第三方服务器不支持跨域而导致浏览器强制静音
            activeAudioPlayer = audioPlayer;
            audioPlayer.muted = isGlobalMuted;
            
            // 切换状态并渲染文本
            switchAvatarState('talking'); 
            const formattedHTML = typeof marked !== 'undefined' ? marked.parse(aiReply) : aiReply.replace(/\n/g, '<br>');
            messageEl.innerHTML = `<strong>你：</strong>${userText}<br><br><strong>小智：</strong><div class="ai-response-format">${formattedHTML}</div>`; 

            statusEl.innerText = "为您找到以下答案"; 
            isAIThinking = false;
            disableMicUI("小智正在讲话...");

            // 增加 play() 的错误捕获，应对部分手机浏览器的严格自动播放限制
            audioPlayer.play().catch(err => {
                console.warn("浏览器拦截了自动播放:", err);
                statusEl.innerText = "请点击屏幕任意位置播放声音";
                // 引导用户点击后恢复播放
                document.body.addEventListener('click', () => {
                     audioPlayer.play();
                     statusEl.innerText = "为您找到以下答案"; 
                }, { once: true });
            });
            
            // 启动可视化动画（由于没有连接 analyser，这里会自动触发我们写好的模拟律动）
            startAIVisualizer(); 

            audioPlayer.onended = () => {
                activeAudioPlayer = null; 
                statusEl.innerText = "小智已准备好，请随时提问"; 
                switchAvatarState('idle'); 
                stopVisualizer(); enableMicUI();    
            };
        } catch (error) {
            activeAudioPlayer = null; 
            statusEl.innerText = "声音加载遇到了点问题";
            stopVisualizer(); enableMicUI(); switchAvatarState('idle'); 
            
            const formattedHTML = typeof marked !== 'undefined' ? marked.parse(aiReply) : aiReply.replace(/\n/g, '<br>');
            messageEl.innerHTML = `<strong>你：</strong>${userText}<br><br><strong>小智：</strong><div class="ai-response-format">${formattedHTML}</div>`; 
        }
    }
   // ==========================================
    // ⛅ 天气模块 (终极优化版：国内极速接口)
    // ==========================================
    const weatherEl = document.querySelector('.weather-info');

    function getWeatherDesc(code) {
        if (code === 0) return "晴 ☀️";
        if (code === 1 || code === 2) return "多云 ⛅";
        if (code === 3) return "阴 ☁️";
        if (code >= 45 && code <= 48) return "雾 🌫️";
        if (code >= 51 && code <= 67) return "雨 🌧️";
        if (code >= 71 && code <= 77) return "雪 ❄️";
        if (code >= 80 && code <= 82) return "阵雨 🌦️";
        if (code >= 95) return "雷暴 ⛈️";
        return "天气";
    }

    async function fetchRealTimeWeather() {
        try {
            // 1. 使用极速国内 IP 接口获取当前城市和经纬度估算 (比 HTML5 GPS 快 10 倍，无需授权)
            // 采用 jsonp 替代跨域限制
            const getCity = async () => {
                return new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = 'https://whois.pconline.com.cn/ipJson.jsp?callback=weatherIpCallback';
                    document.body.appendChild(script);
                    window.weatherIpCallback = (data) => {
                        document.body.removeChild(script);
                        delete window.weatherIpCallback;
                        // 取城市名，去掉"市"
                        let city = (data.city || data.pro || "重庆").replace(/市$/, '');
                        resolve(city);
                    };
                    // 2秒超时保底
                    setTimeout(() => resolve("重庆"), 2000); 
                });
            };

            const cityName = await getCity();
            
            // 2. 如果之前获得了精准经纬度最好，没有的话，尝试发起 HTML5 定位查天气，或者直接用备用坐标
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`);
                    const weatherData = await weatherRes.json();
                    const temp = Math.round(weatherData.current_weather.temperature);
                    const code = weatherData.current_weather.weathercode;
                    weatherEl.innerText = `${cityName} ${temp}°C ${getWeatherDesc(code)}`;
                },
                async () => {
                    // 拒绝定位时，直接使用默认坐标（例如重庆经纬度）结合刚才查到的城市名
                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=29.53&longitude=106.55&current_weather=true&timezone=auto`);
                    const weatherData = await weatherRes.json();
                    weatherEl.innerText = `${cityName} ${Math.round(weatherData.current_weather.temperature)}°C ${getWeatherDesc(weatherData.current_weather.weathercode)}`;
                },
                { timeout: 3000, enableHighAccuracy: false }
            );

        } catch (e) {
            weatherEl.innerText = "天气服务暂歇";
        }
    }
    
    fetchRealTimeWeather();
   // ==========================================
    // 🌌 3. 常驻环境背景 (交互增强版：按住加速光梭)
    // ==========================================
    const bgCanvas = document.getElementById('global-bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgW = bgCanvas.width = window.innerWidth;
    let bgH = bgCanvas.height = window.innerHeight;
    const bgParticles = [];
    
    // 生成 45 个柔和的悬浮光斑
    for(let i = 0; i < 45; i++) {
        bgParticles.push({
            x: Math.random() * bgW, 
            y: Math.random() * bgH,
            radius: Math.random() * 3 + 1,
            vx: (Math.random() - 0.5) * 0.3,
            vy: Math.random() * -0.6 - 0.2, // 基础缓速上浮
            alpha: Math.random() * 0.5 + 0.1,
            alphaChange: (Math.random() * 0.008 + 0.003) * (Math.random() > 0.5 ? 1 : -1),
            color: Math.random() > 0.5 ? '155, 81, 224' : '74, 144, 226'
        });
    }

    // 全局速度倍率，用于实现平滑的“推背感”加速和减速
    let globalSpeedMultiplier = 1;

    function drawBgParticles() {
        bgCtx.clearRect(0, 0, bgW, bgH);

        // 💡 核心交互逻辑：监听 isHolding 变量（用户是否按住麦克风）
        // 如果按住，目标速度飙升到 15 倍；松开则恢复 1 倍
        let targetSpeed = (typeof isHolding !== 'undefined' && isHolding) ? 15 : 1;
        
        // 缓动算法：让加速和减速都有平滑的过渡，避免生硬切换
        globalSpeedMultiplier += (targetSpeed - globalSpeedMultiplier) * 0.1;

        for(let i = 0; i < bgParticles.length; i++) {
            let p = bgParticles[i];
            
            // 计算当前帧的真实速度
            let currentVy = p.vy * globalSpeedMultiplier;
            // 加速上涌时，减弱左右摇摆，让光斑笔直冲向云霄
            let currentVx = globalSpeedMultiplier > 2 ? p.vx * 0.2 : p.vx;
            
            p.x += currentVx; 
            p.y += currentVy;
            
            // 交互增强：按住时，粒子的呼吸上限亮度和闪烁频率变高，显得能量更强
            let maxAlpha = globalSpeedMultiplier > 2 ? 0.9 : 0.6;
            p.alpha += p.alphaChange * (globalSpeedMultiplier > 2 ? 2.5 : 1);
            
            if(p.alpha <= 0.05) {
                p.alpha = 0.05;
                p.alphaChange = Math.abs(p.alphaChange);
            } else if (p.alpha >= maxAlpha) {
                p.alpha = maxAlpha;
                p.alphaChange = -Math.abs(p.alphaChange);
            }
            
            // 如果光斑飘出了屏幕顶部，让它从底部无缝重新出现
            if(p.y < -20) {
                p.y = bgH + 20;
                p.x = Math.random() * bgW;
                p.alpha = 0; // 重生时全透明，平滑滑入
            }
            if(p.x < -10) p.x = bgW + 10;
            if(p.x > bgW + 10) p.x = -10;
            
            // 💡 视觉进阶：速度极快时，将圆点拉长变成“光梭（动态模糊特效）”
            bgCtx.beginPath(); 
            if (globalSpeedMultiplier > 3) {
                bgCtx.moveTo(p.x, p.y);
                // 根据当前向上的速度拉长尾巴
                bgCtx.lineTo(p.x, p.y - currentVy * 1.5);
                bgCtx.strokeStyle = `rgba(${p.color}, ${p.alpha})`;
                bgCtx.lineWidth = p.radius * 2;
                bgCtx.lineCap = "round";
                bgCtx.stroke();
            } else {
                // 速度正常时，恢复为圆润的光斑
                bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); 
                bgCtx.fillStyle = `rgba(${p.color}, ${p.alpha})`; 
                bgCtx.fill();
            }
        }
        requestAnimationFrame(drawBgParticles);
    }
    drawBgParticles();

    // 监听屏幕大小变化
    window.addEventListener('resize', () => { 
        bgW = bgCanvas.width = window.innerWidth; 
        bgH = bgCanvas.height = window.innerHeight; 
    });

</script>
