<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 智能助手 - 小智</title>
    <style>
        /* 🌟 现代 AI 思考状态动画 (流光文字 + 呼吸星芒) */
        .ai-generating-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            font-size: 14.5px;
            font-weight: 600;
            /* 流光渐变色配置 */
            background: linear-gradient(90deg, #9b51e0, #4a90e2, #9b51e0);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShine 2.5s linear infinite;
        }

        /* 保证图标垂直居中，并加入闪烁动画 */
        .ai-sparkle-icon {
            display: inline-block;
            animation: pulseSparkle 1.5s ease-in-out infinite;
        }

        @keyframes gradientShine {
            to { background-position: 200% center; }
        }

        @keyframes pulseSparkle {
            0%, 100% { transform: scale(0.85); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 6px rgba(155, 81, 224, 0.5)); }
        }
        
        /* 顺便美化一下用户的提问文本 */
        .user-text-style {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            padding-bottom: 5px;
            border-bottom: 1px dashed rgba(0,0,0,0.05);
        }
        /* --- 核心亮色拟态背景 --- */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, #fdfaff 0%, #f0ebff 40%, #e6f0ff 80%, #f3ebff 100%);
            color: #333333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            /* 阻止 iOS 点击产生灰色/蓝色高亮半透明遮罩 */
            -webkit-tap-highlight-color: transparent; 
            /* 阻止长按出现默认菜单（保存图片、全屏等） */
            -webkit-touch-callout: none;
            /* 阻止浏览器默认的下拉回弹（橡皮筋效果）和手势导航 */
            overscroll-behavior-y: none;
            touch-action: pan-y;
        }

        .app-container { 
            width: 100%; 
            max-width: 400px; 
            height: 100%; 
            max-height: 850px;
            position: relative; 
            display: flex; 
            flex-direction: column; 
        }

        /* --- 1. 顶部导航 --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
            z-index: 10;
        }
        .icon-btn { 
            font-size: 22px; 
            cursor: pointer; 
            color: #333; 
            font-weight: bold; 
            transition: transform 0.2s;
        }
        .icon-btn:active { transform: scale(0.8); }
        .nav-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }
        
        .weather-info {
            text-align: right;
            font-size: 12px;
            color: #888888;
            padding-right: 20px;
            margin-bottom: 10px;
        }

        /* --- 2. 头部数字人与欢迎区 --- */
        .header-section {
            display: flex;
            padding: 0 20px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .avatar-container {
            width: 130px; 
            height: 190px; 
            border-radius: 16px;
            background: #ffffff; 
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        /* 🌟 核心修改区：让图片和视频完美重叠，并加入透明度过渡动画实现丝滑切换 */
        .avatar-container img, .avatar-container video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            object-position: center top; 
            position: absolute;
            left: 0; 
            top: 0;
            background: #ffffff;
            transition: opacity 0.4s ease-in-out; /* 淡入淡出动画 */
        }

        .greeting-container {
            margin-left: 15px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-top: -20px;
        }

        .greet-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 8px;}
        .highlight-name {
            background: linear-gradient(90deg, #9b51e0, #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .greet-desc { font-size: 12px; color: #666; line-height: 1.5; }

        /* --- 3. 核心交互区 --- */
       /* --- 核心交互区 (修复文字触顶问题) --- */
        /* --- 核心交互区 (提升通透度，让底光透出来) --- */
        .glass-panel {
            flex: 1;
            margin: 0 20px;
            margin-top: -40px; 
            position: relative;
            z-index: 10; 
            /* 💡 核心修改：将白色背景的不透明度从 0.75 降到 0.45 */
            background: rgba(255, 255, 255, 0.45);
            /* 加强模糊效果，让透出来的光芒更柔和高级 */
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 20px 20px 0 20px; 
            /* 添加一点微弱的内发光，增强立体感 */
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5), 0 -5px 30px rgba(100, 100, 150, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        /* 💡 核心修改：让内部容器独立滚动，这样顶部的 20px 留白就会永远存在，文字到了这里就会被裁切 */
        #recommend-content, #chat-content {
            flex: 1;
            overflow-y: auto;
            -ms-overflow-style: none;  
            scrollbar-width: none;
            padding-bottom: 20px; /* 补回底部的留白 */
        }
        #recommend-content::-webkit-scrollbar, #chat-content::-webkit-scrollbar { display: none; }

        #chat-content { display: none; flex-direction: column; height: 100%; }

        /* 移除原有的 emoji 图标，后续在 JS 中用 SVG 替代 */
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; color: #333;}  .rec-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            cursor: pointer;
        }

        #chat-content { display: none; flex-direction: column; height: 100%;}
        
        .status-badge {
            align-self: flex-start;
            background: rgba(155, 81, 224, 0.1);
            color: #9b51e0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        /* 💡 进阶排版的 CSS */
        .ai-response-format { font-size: 14px; line-height: 1.6; color: #444; margin-top: 8px; }
        .ai-response-format p { margin: 0 0 10px 0; }
        .ai-response-format ul { list-style: none; padding-left: 0; margin: 0 0 10px 0; }
        .ai-response-format ul li { position: relative; padding-left: 18px; margin-bottom: 8px; }
        .ai-response-format ul li::before {
            content: ""; position: absolute; left: 4px; top: 8px; width: 5px; height: 5px;
            border-radius: 50%; background-color: #9b51e0; box-shadow: 0 0 4px rgba(155, 81, 224, 0.5);
        }
        .ai-response-format ol { padding-left: 20px; margin: 0 0 10px 0; }
        .ai-response-format ol li { margin-bottom: 8px; }
        .ai-response-format ol li::marker { color: #9b51e0; font-weight: bold; }
        .ai-response-format strong { color: #9b51e0; font-weight: 600; background: rgba(155, 81, 224, 0.08); padding: 2px 6px; border-radius: 6px; margin: 0 2px; }
        .ai-response-format h1, .ai-response-format h2, .ai-response-format h3 {
            margin: 15px 0 8px 0; color: #222; font-size: 15px; position: relative; padding-left: 10px;
        }
        .ai-response-format h1::before, .ai-response-format h2::before, .ai-response-format h3::before {
            content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 3px; border-radius: 2px; background: linear-gradient(180deg, #9b51e0, #4a90e2);
        }

        /* --- 4. 底部长按语音控制区 --- */
        .control-section {
            padding: 15px 20px 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 160px;
        }

        .hint-text { font-size: 13px; color: #888888; margin-bottom: 5px; transition: color 0.3s; }
        /* 这是报错中找不到的 canvas 元素 */
        #wave-canvas { width: 200px; height: 40px; display: none; margin-bottom: 10px; }
        .wave-spacer { height: 40px; width: 100%; margin-bottom: 10px; }

        .mic-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 1); box-shadow: 0 8px 25px rgba(155, 81, 224, 0.2);
            color: #9b51e0; font-size: 28px; display: flex; justify-content: center; align-items: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-tap-highlight-color: transparent; touch-action: none; cursor: pointer;
        }
       /* 🔵 全局讲话背景呼吸灯特效 (音频随动版) */
        body {
            position: relative; 
        }
        
        body::before {
            content: '';
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            /* 💡 核心修改：扩大光晕范围（70% -> 85%），增强基础透明度（0.45 -> 0.65） */
            background: radial-gradient(circle at center 35%, rgba(74, 144, 226, 0.65) 0%, rgba(74, 144, 226, 0) 85%);
            opacity: var(--bg-light-opacity, 0); 
            z-index: -1;
            pointer-events: none;
            transition: opacity 0.1s linear; 
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="app-container">
    <div class="top-nav">
        <div class="icon-btn">≡</div>
        <div class="nav-title">小智</div> 
        <div class="icon-btn" id="mute-btn" style="display: flex; align-items: center;">
            <svg id="vol-on-icon" viewBox="0 0 24 24" width="22" height="22" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="vol-off-icon" viewBox="0 0 24 24" width="22" height="22" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="1" x2="1" y2="23"></line>
            </svg>
        </div>
    </div>
    <div class="weather-info">定位中...</div>

    <div class="header-section">
        <div class="avatar-container">
            <img id="static-avatar" src="https://ai-avatar-wwl.oss-cn-beijing.aliyuncs.com/12.jpg" style="opacity: 1; z-index: 1;">
            <video id="thinking-video" src="https://ai-avatar-wwl.oss-cn-beijing.aliyuncs.com/sikao.mp4" loop muted playsinline webkit-playsinline preload="auto" style="opacity: 0; z-index: 2;"></video>
            <video id="talking-video" src="https://ai-avatar-wwl.oss-cn-beijing.aliyuncs.com/video.mp4" loop muted playsinline webkit-playsinline preload="auto" style="opacity: 0; z-index: 3;"></video>
        </div>
        
        <div class="greeting-container">
            <div class="greet-title">👋 嗨，我是<span class="highlight-name">小智</span></div>
            <div class="greet-desc">我是人工智能学院专属助手小智，你的AI学习与生活指南，按住下方即可语音交流!</div>
        </div>
    </div>

    <div class="glass-panel" id="main-panel">
        <div id="recommend-content"></div>
        <div id="chat-content">
            <div class="status-badge" id="status">小智已准备好，请随时提问</div>
            <div class="message-content" id="message">期待与您的对话...</div>
        </div>
    </div>

    <div class="control-section">
        <div class="hint-text" id="hint-text">按住说话，上划取消</div>
        <canvas id="wave-canvas" width="400" height="80"></canvas>
        <div class="wave-spacer" id="wave-spacer"></div>
        <div class="mic-btn" id="mic-btn">🎙️</div>
    </div>
</div>

<script>
    const QUESTIONS_POOL = [
        "咱们学院有哪些专业？", "怎么查询课表和考试安排？", "学院领导和任课老师有哪些？", "实训室使用有什么规定？", "近期有哪些技能竞赛可以报名？", "奖助学金申请流程是什么？",
        "人工智能技术应用专业核心课程有哪些？", "Python、机器学习该怎么入门学习？", "本专业可以使用哪些免费 AI 工具？", "数字媒体技术专业就业方向有哪些？", "课程设计 / 毕业设计有哪些参考方向？", "专业教材和学习资料在哪里领取？",
        "学院各教研室负责人是谁？", "如何联系专业任课老师？", "转专业的条件和办理流程是什么？", "请假、补办证件怎么办理？", "成绩查询与复核流程是什么？", "日常教学管理有哪些规章制度？",
        "学院有哪些专业实训室和实训基地？", "巴南实训基地相关管理规定是什么？", "本院常参加哪些职业技能大赛？", "竞赛报名时间和备赛要求有哪些？", "实训室使用规范与安全守则？", "校企合作企业有哪些，实训安排如何？",
        "计算机机房用电安全注意事项？", "如何防范网络诈骗、信息泄露？", "实验室应急处置方法有哪些？", "校园消防安全须知？", "数据安全使用有哪些规范？",
        "本专业实习岗位和要求是什么？", "合作企业招聘信息在哪里查看？", "简历制作和面试有哪些技巧？", "专科升学相关政策与渠道？"
    ];

    // 🌟 获取图层元素 (适配最新的 HTML 结构)
    const staticAvatar = document.getElementById('static-avatar');
    const thinkingVideo = document.getElementById('thinking-video');
    const talkingVideo = document.getElementById('talking-video');

    const micBtn = document.getElementById('mic-btn');
    const muteBtn = document.getElementById('mute-btn'); 
    const statusEl = document.getElementById('status');
    const messageEl = document.getElementById('message');
    const hintText = document.getElementById('hint-text');
    
    const recommendContent = document.getElementById('recommend-content');
    const chatContent = document.getElementById('chat-content');

    const waveCanvas = document.getElementById('wave-canvas');
    const waveSpacer = document.getElementById('wave-spacer');
    const canvasCtx = waveCanvas.getContext('2d'); // 这里就不会报错了

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN'; 
    recognition.continuous = false; 

    let isRecording = false;
    let isAITalking = false; 
    let isAIThinking = false; 
    let isHolding = false;
    let isCanceling = false;
    let startY = 0;
    const CANCEL_THRESHOLD = 50; 

    // ==========================================
    // 🤖 丝滑状态切换引擎 (淡入淡出核心)
    // ==========================================
    // ==========================================
    // 🤖 丝滑状态切换引擎 (新增背景呼吸灯控制)
    // ==========================================
    function switchAvatarState(state) {
        if (state === 'idle') {
            document.body.classList.remove('talking-mode'); // 关闭呼吸灯
            
            staticAvatar.style.opacity = '1';
            thinkingVideo.style.opacity = '0';
            talkingVideo.style.opacity = '0';
            
            setTimeout(() => {
                thinkingVideo.pause();
                talkingVideo.pause();
            }, 400);
            
        } else if (state === 'thinking') {
            document.body.classList.remove('talking-mode'); // 关闭呼吸灯
            
            thinkingVideo.play().catch(()=>{});
            staticAvatar.style.opacity = '0';
            thinkingVideo.style.opacity = '1';
            talkingVideo.style.opacity = '0';
            
            setTimeout(() => { talkingVideo.pause(); }, 400);
            
        } else if (state === 'talking') {
            document.body.classList.add('talking-mode'); // 开启蓝色呼吸灯
            
            talkingVideo.play().catch(()=>{});
            staticAvatar.style.opacity = '0';
            thinkingVideo.style.opacity = '0';
            talkingVideo.style.opacity = '1';
            
            setTimeout(() => { thinkingVideo.pause(); }, 400);
        }
    }

   // === 渲染随机问题 (加入现代矢量图标) ===
    function renderRandomQuestions() {
        const shuffled = [...QUESTIONS_POOL].sort(() => 0.5 - Math.random());
        const selectedQuestions = shuffled.slice(0, 4);
        
        // 💡 核心修改：加入一个紫色的“指南针(探索)” SVG 图标，寓意发现与推荐
        let htmlContent = `
            <div class="section-title">
                推荐问题
                <svg style="margin-left: 6px; color: #9b51e0;" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
            </div>
        `;
        
        selectedQuestions.forEach(q => {
            htmlContent += `<div class="rec-item" onclick="handleRecommendClick('${q}')">${q} <span>›</span></div>`;
        });
        recommendContent.innerHTML = htmlContent;
    }
    renderRandomQuestions();

    // === 点击推荐问题逻辑 ===
    function handleRecommendClick(question) {
        if (isAITalking || isAIThinking) return; 

        switchToChat();
        messageEl.innerHTML = `<strong>你：</strong>${question}`;
        statusEl.innerText = "正在云端思考...";
        
        isAIThinking = true;
        disableMicUI("小智正在思考，请稍候...");
        stopVisualizer(); 
        
        switchAvatarState('thinking'); // 切为思考状态
        callDeepSeek(question);
    }

    // ==========================================
    // 🔊 声音控制模块
    // ==========================================
    // ==========================================
    // 🔊 声音控制模块 (支持 SVG 切换)
    // ==========================================
    let isGlobalMuted = false;
    let activeAudioPlayer = null; 

    muteBtn.addEventListener('click', () => {
        isGlobalMuted = !isGlobalMuted;
        
        // 切换 SVG 图标的显示状态
        document.getElementById('vol-on-icon').style.display = isGlobalMuted ? 'none' : 'block';
        document.getElementById('vol-off-icon').style.display = isGlobalMuted ? 'block' : 'none';
        
        if (activeAudioPlayer) activeAudioPlayer.muted = isGlobalMuted;
    });

    function disableMicUI(reasonText) {
        micBtn.style.opacity = '0.5';
        hintText.innerText = reasonText;
        hintText.style.color = "#888";
    }

    function enableMicUI() {
        isAITalking = false;
        isAIThinking = false;
        micBtn.style.opacity = '1';
        if (!isRecording && !isHolding) {
            hintText.innerText = "按住说话，上划取消";
            hintText.style.color = "#888";
        }
    }

    function switchToChat() {
        recommendContent.style.display = 'none';
        chatContent.style.display = 'flex';
    }

    // --- 语音识别事件 ---
    recognition.onerror = () => {
        if (isCanceling) return; 
        isRecording = false; stopVisualizer(); enableMicUI();
        hintText.innerText = "未听清，请重新按住说话";
        setTimeout(() => enableMicUI(), 2000);
    };

    recognition.onend = () => {
        if (isRecording && !isCanceling && !isAIThinking) {
            isRecording = false; stopVisualizer();
            hintText.innerText = "未识别到声音，请重试";
            setTimeout(() => enableMicUI(), 2000);
        }
    };

    recognition.onresult = (event) => {
        if (isCanceling) return; 
        const userText = event.results[0][0].transcript;
        messageEl.innerHTML = `<strong>你：</strong>${userText}`;
        statusEl.innerText = "正在云端思考...";
        
        isRecording = false;
        isAIThinking = true;
        disableMicUI("小智正在思考，请稍候...");
        stopVisualizer(); 
        
        switchAvatarState('thinking'); // 切为思考状态
        callDeepSeek(userText);
    };

    // --- 触控事件 ---
    const handleInputStart = (e) => {
        if (isAITalking || isAIThinking) {
            hintText.innerText = isAITalking ? "小智正在讲话..." : "小智正在思考...";
            return;
        }
        e.preventDefault(); 
        
        // 🚀 iOS/Safari 黑科技：用户触摸瞬间解锁两个视频的自动播放限制
        thinkingVideo.play().then(() => thinkingVideo.pause()).catch(() => {});
        talkingVideo.play().then(() => talkingVideo.pause()).catch(() => {});

        isHolding = true;
        isCanceling = false;
        startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        
        micBtn.style.transform = 'scale(1.15)';
        micBtn.style.boxShadow = '0 8px 30px rgba(155, 81, 224, 0.4)';
        hintText.innerText = "松开发送，上划取消";
        hintText.style.color = "#9b51e0";
        
        if (!isRecording) {
            try { recognition.start(); } catch(err) {}
            statusEl.innerText = "正在聆听...";
            isRecording = true;
            switchToChat();
            startVisualizer(); 
        }
    };

    const handleInputMove = (e) => {
        if (!isHolding) return;
        e.preventDefault();
        let currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        
        if (startY - currentY > CANCEL_THRESHOLD) {
            isCanceling = true;
            hintText.innerText = "松开手指，取消发送";
            hintText.style.color = "#ff4d4f"; 
            micBtn.style.transform = 'scale(0.9)';
            micBtn.style.background = "rgba(255, 77, 79, 0.1)";
            micBtn.style.borderColor = "#ff4d4f";
            micBtn.style.boxShadow = '0 8px 25px rgba(255, 77, 79, 0.3)';
        } else {
            isCanceling = false;
            hintText.innerText = "松开发送，上划取消";
            hintText.style.color = "#9b51e0";
            micBtn.style.transform = 'scale(1.15)';
            micBtn.style.background = "rgba(255, 255, 255, 0.6)";
            micBtn.style.borderColor = "rgba(255, 255, 255, 1)";
            micBtn.style.boxShadow = '0 8px 30px rgba(155, 81, 224, 0.4)';
        }
    };

    const handleInputEnd = (e) => {
        if (!isHolding) return;
        isHolding = false;
        
        micBtn.style.transform = 'scale(1)';
        micBtn.style.background = "rgba(255, 255, 255, 0.6)";
        micBtn.style.borderColor = "rgba(255, 255, 255, 1)";
        micBtn.style.boxShadow = '0 8px 25px rgba(155, 81, 224, 0.2)';
        hintText.style.color = "#888888";
        
        if (isCanceling) {
            hintText.innerText = "已取消发送";
            recognition.abort(); 
            isRecording = false; stopVisualizer();
            setTimeout(() => enableMicUI(), 1000); 
        } else {
            hintText.innerText = "正在处理语音...";
            recognition.stop(); 
        }
    };

    micBtn.addEventListener('touchstart', handleInputStart, { passive: false });
    window.addEventListener('touchmove', handleInputMove, { passive: false });
    window.addEventListener('touchend', handleInputEnd);
    micBtn.addEventListener('mousedown', handleInputStart);
    window.addEventListener('mousemove', handleInputMove);
    window.addEventListener('mouseup', handleInputEnd);

    // ==========================================
    // 🌊 波浪动画配置
    // ==========================================
    let audioContext, analyser, microphone, drawVisual;
    let currentAmplitude = 0; let phase = 0; 
    const userWaves = [ { color: 'rgba(186, 85, 211, 0.8)', speed: 1.0, height: 1.0, lineWidth: 3 }, { color: 'rgba(216, 112, 214, 0.5)', speed: 1.3, height: 0.7, lineWidth: 2 }, { color: 'rgba(238, 130, 238, 0.4)', speed: 0.8, height: 0.5, lineWidth: 2 } ];
    const aiWaves = [ { color: 'rgba(74, 144, 226, 0.8)', speed: 1.0, height: 1.0, lineWidth: 3 }, { color: 'rgba(100, 181, 246, 0.5)', speed: 1.3, height: 0.7, lineWidth: 2 }, { color: 'rgba(144, 202, 249, 0.4)', speed: 0.8, height: 0.5, lineWidth: 2 } ];

    // ==========================================
    // 🌊 波浪动画引擎 (已修复音量模拟与声光同步)
    // ==========================================
    function drawWave() {
        if (!isRecording && !isAITalking) {
            document.body.style.setProperty('--bg-light-opacity', '0'); // 停止时关灯
            return; 
        }
        drawVisual = requestAnimationFrame(drawWave);
        let averageVolume = 0;
        
        // 1. 尝试从分析器中获取真实声音数据 (主要针对麦克风录音时)
        if (analyser) {
            const bufferLength = analyser.frequencyBinCount; 
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray); 
            let sum = 0; for(let i = 0; i < bufferLength; i++) sum += dataArray[i];
            averageVolume = sum / bufferLength;
        }

        // 🚨 2. 核心修复点：找回丢失的兜底模拟逻辑！
        // 如果 AI 在说话，但由于没有接入分析器拿不到真实音量，则用数学公式模拟出一个逼真的呼吸节奏
        if (isAITalking && averageVolume < 2) {
             const time = Date.now() / 150; // 控制呼吸频率
             averageVolume = 25 + Math.sin(time) * 15 + Math.random() * 15; // 正弦波结合随机数模拟语音抑扬顿挫
        }

        // 3. 计算当前平滑振幅
        let targetAmplitude = (averageVolume / 100); 
        if (targetAmplitude < 0.1) targetAmplitude = 0.1; // 设定一个最小的基准线
        currentAmplitude += (targetAmplitude - currentAmplitude) * 0.15; // 运用缓动算法让变化更丝滑

        // 🔵 4. 将平滑后的振幅映射为蓝色背景灯的透明度，实现声光同步
        if (isAITalking) {
            let lightOpacity = currentAmplitude * 1.5; // 💡 增强基础光芒倍数，让呼吸灯更明显
            if (lightOpacity > 1.0) lightOpacity = 1.0; // 封顶最高亮度为 100%
            document.body.style.setProperty('--bg-light-opacity', lightOpacity.toFixed(2));
        } else {
            document.body.style.setProperty('--bg-light-opacity', '0');
        }

        // 5. 绘制底部波浪线
        canvasCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
        phase += 0.08; 
        const centerY = waveCanvas.height / 2; const width = waveCanvas.width;
        // 用户录音用紫色波浪 (userWaves)，AI 回答用蓝色波浪 (aiWaves)
        const currentWaves = isRecording ? userWaves : aiWaves;
        currentWaves.forEach(wave => {
            canvasCtx.beginPath(); canvasCtx.moveTo(0, centerY);
            for (let x = 0; x <= width; x++) {
                const xNorm = x / width; const taper = Math.sin(xNorm * Math.PI); 
                // 这里的 currentAmplitude 就是上面的音量数据，如果有起伏，波浪就会跟着跳动
                const y = centerY + Math.sin(xNorm * 8 + phase * wave.speed) * (currentAmplitude * 40 * wave.height) * taper;
                canvasCtx.lineTo(x, y);
            }
            canvasCtx.strokeStyle = wave.color; canvasCtx.lineWidth = wave.lineWidth; canvasCtx.stroke();
        });
    }

    async function startVisualizer() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; microphone.connect(analyser);
            } catch(err) { return; }
        }
        if (audioContext.state === 'suspended') audioContext.resume();
        waveSpacer.style.display = 'none'; waveCanvas.style.display = 'block';
        if (!drawVisual) drawWave();
    }
    function startAIVisualizer() { isAITalking = true; waveSpacer.style.display = 'none'; waveCanvas.style.display = 'block'; if (!drawVisual) drawWave(); }
    function stopVisualizer() { 
            isAITalking = false; 
            document.body.style.setProperty('--bg-light-opacity', '0'); // 关闭呼吸灯
            if (drawVisual) { cancelAnimationFrame(drawVisual); drawVisual = null; } 
            waveCanvas.style.display = 'none'; waveSpacer.style.display = 'block'; 
        }
    // ==========================================
    // 🧠 接口交互
    // ==========================================
   // ==========================================
    // 🧠 接口交互 (优化同步与人设)
    // ==========================================
   // ==========================================
    // 🧠 接口交互 (优化同步与人设)
    // ==========================================
    async function callDeepSeek(text) {
        try {
            // 【优化】采用高级的星芒图标 + 流光文字效果，并美化用户的提问排版
            messageEl.innerHTML = `
                <div class="user-text-style"><strong>🧑 你：</strong>${text}</div>
                <div class="ai-generating-wrapper">
                    <svg class="ai-sparkle-icon" viewBox="0 0 24 24" width="18" height="18" fill="url(#sparkle-grad)">
                        <defs>
                            <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#9b51e0" />
                                <stop offset="100%" stop-color="#4a90e2" />
                            </linearGradient>
                        </defs>
                        <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"></path>
                    </svg>
                    小智正在极速检索知识库...
                </div>
            `; 
            
            statusEl.innerText = "正在为您检索信息"; 
            
            const dsResponse = await fetch('https://ojr9d97ks4.sealosbja.site/chat', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text })
            });
            const data = await dsResponse.json();
            const aiReply = data.reply;
            
            generateTalkingHeadVideo(text, aiReply);
        } catch (error) {
            statusEl.innerText = "网络似乎有点小情绪"; 
            enableMicUI(); switchAvatarState('idle'); 
            messageEl.innerHTML = `<div class="user-text-style"><strong>🧑 你：</strong>${text}</div><br><strong>小智：</strong>网络好像开小差了，请稍后再试一次吧。`;
        }
    }

   // ==========================================
    // 🧠 接口交互 (修复跨域导致的静音问题)
    // ==========================================
    async function generateTalkingHeadVideo(userText, aiReply) {
        try {
            statusEl.innerText = "正在努力组织语言"; 
            
            const generateRes = await fetch('https://ojr9d97ks4.sealosbja.site/generate', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: aiReply })
            });
            const generateData = await generateRes.json();
            if (!generateData.audio_url) throw new Error("获取音频失败");

            const safeAudioUrl = generateData.audio_url.replace("http://", "https://");
            const audioPlayer = new Audio(safeAudioUrl);
            
            // 🚨 修复核心：移除了 crossOrigin 和 Web Audio API (audioContext) 的绑定
            // 避免第三方服务器不支持跨域而导致浏览器强制静音
            activeAudioPlayer = audioPlayer;
            audioPlayer.muted = isGlobalMuted;
            
            // 切换状态并渲染文本
            switchAvatarState('talking'); 
            const formattedHTML = typeof marked !== 'undefined' ? marked.parse(aiReply) : aiReply.replace(/\n/g, '<br>');
            messageEl.innerHTML = `<strong>你：</strong>${userText}<br><br><strong>小智：</strong><div class="ai-response-format">${formattedHTML}</div>`; 

            statusEl.innerText = "为您找到以下答案"; 
            isAIThinking = false;
            disableMicUI("小智正在讲话...");

            // 增加 play() 的错误捕获，应对部分手机浏览器的严格自动播放限制
            audioPlayer.play().catch(err => {
                console.warn("浏览器拦截了自动播放:", err);
                statusEl.innerText = "请点击屏幕任意位置播放声音";
                // 引导用户点击后恢复播放
                document.body.addEventListener('click', () => {
                     audioPlayer.play();
                     statusEl.innerText = "为您找到以下答案"; 
                }, { once: true });
            });
            
            // 启动可视化动画（由于没有连接 analyser，这里会自动触发我们写好的模拟律动）
            startAIVisualizer(); 

            audioPlayer.onended = () => {
                activeAudioPlayer = null; 
                statusEl.innerText = "小智已准备好，请随时提问"; 
                switchAvatarState('idle'); 
                stopVisualizer(); enableMicUI();    
            };
        } catch (error) {
            activeAudioPlayer = null; 
            statusEl.innerText = "声音加载遇到了点问题";
            stopVisualizer(); enableMicUI(); switchAvatarState('idle'); 
            
            const formattedHTML = typeof marked !== 'undefined' ? marked.parse(aiReply) : aiReply.replace(/\n/g, '<br>');
            messageEl.innerHTML = `<strong>你：</strong>${userText}<br><br><strong>小智：</strong><div class="ai-response-format">${formattedHTML}</div>`; 
        }
    }
    // ==========================================
    // ⛅ 天气模块 (专为手机端优化的鲁棒定位逻辑)
    // ==========================================
    const weatherEl = document.querySelector('.weather-info');

    // 解析更丰富的天气状态代码 (Open-Meteo WMO 代码规范)
    function getWeatherDesc(code) {
        if (code === 0) return "晴 ☀️";
        if (code === 1 || code === 2) return "多云 ⛅";
        if (code === 3) return "阴 ☁️";
        if (code >= 45 && code <= 48) return "雾 🌫️";
        if (code >= 51 && code <= 67) return "雨 🌧️";
        if (code >= 71 && code <= 77) return "雪 ❄️";
        if (code >= 80 && code <= 82) return "阵雨 🌦️";
        if (code >= 95) return "雷暴 ⛈️";
        return "未知";
    }

    // 根据坐标获取并渲染天气
    async function fetchWeatherByCoords(lat, lon, cityName) {
        try {
            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`);
            const weatherData = await weatherRes.json();
            const temp = Math.round(weatherData.current_weather.temperature);
            const code = weatherData.current_weather.weathercode;
            const desc = getWeatherDesc(code);
            weatherEl.innerText = `${cityName} ${temp}°C ${desc}`;
        } catch (e) {
            weatherEl.innerText = "天气加载失败";
        }
    }

    function fetchRealTimeWeather() {
        // 🚨 兜底策略：如果定位失败、超时或用户拒绝，默认显示学院所在地（重庆）
        const defaultLat = 29.53;
        const defaultLon = 106.55;
        const defaultCity = "重庆";

        if (!navigator.geolocation) {
            fetchWeatherByCoords(defaultLat, defaultLon, defaultCity);
            return;
        }

        // 定位参数配置
        const options = {
            enableHighAccuracy: false, // 关闭高精度（采用基站定位即可），能大幅提高手机端出结果的速度
            timeout: 5000,             // 最高等待 5 秒，超过 5 秒算作失败
            maximumAge: 300000         // 允许使用 5 分钟内的缓存位置
        };

        navigator.geolocation.getCurrentPosition(
            async (position) => {
                try {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // 使用 AbortController 为城市名称解析接口增加 3 秒超时限制
                    const geoCtrl = new AbortController();
                    const geoTimeout = setTimeout(() => geoCtrl.abort(), 3000);
                    
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1`, { 
                        headers: { 'Accept-Language': 'zh-CN' },
                        signal: geoCtrl.signal 
                    });
                    clearTimeout(geoTimeout);
                    
                    const geoData = await geoRes.json();
                    let city = geoData.address.city || geoData.address.town || geoData.address.county || "当地";
                    city = city.replace(/市$|区$|县$/, ''); // 优化视觉：去掉后缀，例如把"重庆市"精简为"重庆"
                    
                    fetchWeatherByCoords(lat, lon, city);
                } catch (e) {
                    // 如果城市名称接口超时或被拦截，不要卡死，直接用坐标查天气，名称显示"当地"
                    fetchWeatherByCoords(position.coords.latitude, position.coords.longitude, "当地");
                }
            },
            (error) => {
                console.warn("手机定位受限或超时，启用默认城市兜底。原因:", error.message);
                // 核心修复：一旦定位失败（如微信环境无权限），立刻显示兜底城市天气，不再卡在“定位中...”
                fetchWeatherByCoords(defaultLat, defaultLon, defaultCity);
            },
            options
        );
    }
    
    // 初始化调用
    fetchRealTimeWeather();
</script>
