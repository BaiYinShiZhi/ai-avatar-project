<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 数字人交互桌面 - 极速循环版</title>
    <style>
        body { background-color: #F4EBE2; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #222; }
        .container { width: 380px; background: #fff; border: 3px solid #111; box-shadow: 6px 6px 0px #FF4800; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        
        .avatar-box { 
            height: 380px; 
            background-color: #000; 
            position: relative; 
            border-bottom: 3px solid #111; 
            overflow: hidden; 
        }
        
        .avatar-image { 
            width: 100%;    
            height: 100%;   
            border-radius: 0; 
            border: none;     
            object-fit: contain; 
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #video-container { 
            width: 100%; 
            height: 100%; 
            display: none; 
            object-fit: contain; 
            position: absolute; 
            top: 0; 
            left: 0;
        }

        .chat-box { padding: 20px; height: 130px; overflow-y: auto; background-image: radial-gradient(#ccc 1px, transparent 1px); background-size: 10px 10px; border-top: 3px solid #111; }
        .status-text { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #FF4800; }
        .message { font-size: 16px; line-height: 1.5; }
        .control-panel { padding: 20px; background: #fff; border-top: 3px solid #111; text-align: center; }
        button { background-color: #FFEC00; border: 3px solid #111; box-shadow: 3px 3px 0px #111; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: all 0.1s; }
        button:active { box-shadow: 0px 0px 0px #111; transform: translate(3px, 3px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="avatar-box">
        <img class="avatar-image" id="static-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ccc' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
        <!-- 💡 修复手机端黑屏/全屏问题的视频标签 -->
        <video id="video-container" playsinline webkit-playsinline></video>
    </div>

    <div class="chat-box">
        <div class="status-text" id="status">系统待机中...</div>
        <div class="message" id="message"></div>
    </div>

    <div class="control-panel">
        <button id="mic-btn">🎙️ 点击说话</button>
    </div>
</div>

<script>
    // 你的公网固定照片链接 (平时待机显示的静止图片)
    const FIXED_IMAGE_HTTPS_URL = "https://ai-avatar-wwl.oss-cn-beijing.aliyuncs.com/ren.jpg";
    
    // ⚠️ 记得在这里换上你 OSS 里的那个“2秒嘴巴在动”的万能短视频链接！！！
    const LOOPING_VIDEO_URL = "https://ai-avatar-wwl.oss-cn-beijing.aliyuncs.com/video.mp4";

    const staticAvatar = document.getElementById('static-avatar');
    const videoContainer = document.getElementById('video-container');
    const micBtn = document.getElementById('mic-btn');
    const statusEl = document.getElementById('status');
    const messageEl = document.getElementById('message');

    if(FIXED_IMAGE_HTTPS_URL && FIXED_IMAGE_HTTPS_URL.startsWith('http')){
        staticAvatar.src = FIXED_IMAGE_HTTPS_URL;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN'; 
    let isRecording = false;

    micBtn.addEventListener('click', () => {
        // --- 核心魔法：预激活手机端视频播放权限（防黑屏无声） ---
        videoContainer.muted = true; 
        videoContainer.play().then(() => {
            videoContainer.pause();      
            videoContainer.muted = false;
        }).catch(err => {
            console.log("权限预激活被忽略(正常现象)", err);
        });
        // -----------------------------------------------------

        if (!isRecording) {
            recognition.start();
            statusEl.innerText = "正在聆听...";
            micBtn.innerText = "🛑 录音中";
            isRecording = true;
        }
    });

    recognition.onresult = (event) => {
        const userText = event.results[0][0].transcript;
        messageEl.innerHTML = `<strong>你：</strong>${userText}`;
        statusEl.innerText = "大脑思考中...";
        micBtn.innerText = "🎙️ 点击说话";
        isRecording = false;
        callDeepSeek(userText);
    };

    // 1. 调用 Laf 大脑 chat 函数 (已更新为你的新链接)
    async function callDeepSeek(text) {
        try {
            const dsResponse = await fetch('https://ojr9d97ks4.sealosbja.site/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            
            const data = await dsResponse.json();
            const aiReply = data.reply;
            messageEl.innerHTML = `<strong>AI：</strong>${aiReply}`;
            
            generateTalkingHeadVideo(aiReply);
        } catch (error) {
            statusEl.innerText = "网络连接出错";
            console.error(error);
        }
    }

    // 2. 调用 Laf 极速语音生成 generate 函数 (已更新为你的新链接)
    async function generateTalkingHeadVideo(text) {
        try {
            statusEl.innerText = "正在生成语音...";
            
            const generateRes = await fetch('https://ojr9d97ks4.sealosbja.site/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const generateData = await generateRes.json();
            const audioUrl = generateData.audio_url;
            
            if (!audioUrl) throw new Error("获取音频失败");

            // --- 循环视频+语音播放魔法 ---
            const safeAudioUrl = audioUrl.replace("http://", "https://");
            const audioPlayer = new Audio(safeAudioUrl);
            
            // 隐藏静态图，播放循环动嘴视频
            staticAvatar.style.display = 'none';
            videoContainer.src = LOOPING_VIDEO_URL;
            videoContainer.loop = true; 
            videoContainer.style.display = 'block';

            // 👉 关键补丁：强制浏览器加载新的视频源
            videoContainer.load(); 

            videoContainer.muted = true; 
            // 稍微延迟一丢丢再播放，给浏览器一点缓冲时间
            setTimeout(() => {
                videoContainer.play();
            }, 100);

            // 播放真实的生成声音
            statusEl.innerText = "播放中...";
            audioPlayer.play();

            // 监听到声音放完，瞬间切回静态图
            audioPlayer.onended = () => {
                videoContainer.pause();
                videoContainer.style.display = 'none';
                staticAvatar.style.display = 'block';
                statusEl.innerText = "系统待机中...";
            };

        } catch (error) {
            statusEl.innerText = "播放失败";
            console.error(error);
        }
    }
</script>
</body>
</html>
